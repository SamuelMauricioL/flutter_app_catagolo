name: app_catalogo
description: App catalogo
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.6.1 <4.0.0'

dependencies:
  bloc: ^9.0.1 # gestor de estados
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1 # gestor de estados
  flutter_localizations:
    sdk: flutter
  equatable: ^2.0.3 # igualar objetos
  connectivity_plus: ^7.0.0 # verificar conectividad
  get_storage: ^2.0.3 # almacenamiento local
  iconsax: ^0.0.8 # iconos
  flow_builder: ^0.1.0 # navegación
  http: ^1.5.0 # peticiones http
  oxidized: ^6.2.0 # manejo de errores
  flutter_svg: ^2.2.1 # svg
  cached_network_image: ^3.2.1 # almacenar en cache las imágenes que se descargar

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: 9.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/catalog.jpeg"

flutter:
  uses-material-design: true # design system de google
  generate: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: BwNista
      fonts:
        - asset: assets/font/BwNistaGrotesk-Regular.ttf
        - asset: assets/font/BwNistaGrotesk-Black.ttf
          weight: 900
        - asset: assets/font/BwNistaGrotesk-Bold.ttf
          weight: 700
        - asset: assets/font/BwNistaGrotesk-Medium.ttf
          weight: 600
